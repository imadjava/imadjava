server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:4497}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.example: DEBUG